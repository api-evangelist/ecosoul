generated: '2026-07-19'
method: searched
status: published
source: https://www.ecosoulhome.com/.well-known/ucp
notes: >-
  EcoSoul Home is a Shopify store that exposes an agent-commerce MCP endpoint via the
  Universal Commerce Protocol (UCP). The MCP endpoint enforces agent authentication —
  a UCP agent profile URI must be presented, so an unauthenticated tools/list returns
  error -32001 (invalid_profile_url). The capability/tool surface below is transcribed
  verbatim from the store's published UCP merchant profile (/.well-known/ucp) and the
  agent flow documented in /llms.txt; it is not an unauthenticated live tools/list dump.
server:
  name: ecosoul-home
  transport: http
  url: https://www.ecosoulhome.com/api/ucp/mcp
  content_type: application/json
  upstream: https://ecosoul-home.myshopify.com/api/ucp/mcp
  protocol: dev.ucp.shopping
  ucp_versions:
  - '2026-04-08'
  - '2026-01-23'
  auth:
    required: true
    scheme: UCP agent profile URI (context.profile) + buyer approval for checkout
    error_without_profile: '-32001 invalid_profile_url'
capabilities:
- id: dev.ucp.shopping.catalog.search
  spec: https://ucp.dev/2026-04-08/specification/catalog
- id: dev.ucp.shopping.catalog.lookup
  spec: https://ucp.dev/2026-04-08/specification/catalog
- id: dev.ucp.shopping.cart
  spec: https://ucp.dev/2026-04-08/specification/cart
- id: dev.ucp.shopping.checkout
  spec: https://ucp.dev/2026-04-08/specification/checkout
- id: dev.ucp.shopping.fulfillment
  spec: https://ucp.dev/2026-04-08/specification/fulfillment
- id: dev.ucp.shopping.discount
  spec: https://ucp.dev/2026-04-08/specification/discount
- id: dev.ucp.shopping.order
  spec: https://ucp.dev/2026-04-08/specs/shopping/order
- id: dev.shopify.catalog
  spec: https://shopify.dev/docs/agents/catalog/storefront-catalog
tools:
- name: search_catalog
  description: Find products matching the buyer's intent (dev.ucp.shopping.catalog.search)
- name: create_cart
  description: Create a cart and add desired items (dev.ucp.shopping.cart)
- name: create_checkout
  description: Start the purchase flow (dev.ucp.shopping.checkout)
- name: update_checkout
  description: Set shipping address and method (dev.ucp.shopping.fulfillment)
- name: complete_checkout
  description: Finalize the purchase — buyer must approve payment (dev.ucp.shopping.checkout)
payment_handlers:
- com.google.pay
- dev.shopify.card
- dev.shopify.shop_pay
