aid: ecosoul
name: EcoSoul Home
description: >-
  EcoSoul Home is a direct-to-consumer sustainable home-essentials brand selling
  compostable and eco-friendly tableware — plates, bowls, hot cups, cutlery, napkins,
  bagasse and areca-leaf products — plus everyday household goods made from renewable
  materials. The brand sells online through its Shopify storefront (and via major
  retail marketplaces) with the mission of replacing single-use plastic in the home.
  Backed by Accel, EcoSoul was added to the API Evangelist network as a portfolio
  lead and enriched from its public agent-native commerce surface: a published
  /llms.txt (agents.md) instruction file, Shopify Customer Accounts OpenID Connect
  for authentication, and a Universal Commerce Protocol (UCP) MCP endpoint that lets
  buyer-approved AI shopping agents search the catalog, build carts, and complete
  checkout via Shop Pay, Google Pay, or card.
